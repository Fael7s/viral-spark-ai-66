name: CI

# O deploy NAO acontece aqui. Publicar e uma acao manual no Lovable
# ("Publicar alteracoes"). Este workflow so responde a pergunta "esta
# quebrado?" antes de alguem publicar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A resolucao de dependencias usa bun porque bun.lock e a fonte de
      # verdade e o build do Lovable instala com bun (ver bunfig.toml).
      # Instalar por npm produziria uma arvore diferente da de producao.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # Os tres checks rodam sob Node, que e o runtime onde tsc, eslint e
      # vitest foram verificados, e a mesma major que o ambiente do Lovable.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Os tres passos ficam separados de proposito: juntos, a saida do
      # GitHub nao diria qual dos tres quebrou.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test
